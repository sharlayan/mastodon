name: Voice signal tests
on:
  push:
    branches:
      - 'develop'
      - 'main'
    paths:
      - voice_signal/**
      - .github/workflows/test-voice-signal.yml
  pull_request:
    paths:
      - voice_signal/**
      - .github/workflows/test-voice-signal.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build
        run: dotnet build voice_signal/VoiceSignal.slnx --warnaserror

      - name: Test
        run: dotnet test voice_signal/VoiceSignal.slnx --no-build
