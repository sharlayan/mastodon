name: Build voice signal image
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - voice_signal/**
      - .dockerignore
      - .github/workflows/build-voice-signal.yml

permissions:
  contents: read
  packages: write

jobs:
  build-image-voice-signal:
    if: github.repository == 'sharlayan/mastodon'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    uses: ./.github/workflows/build-container-image.yml
    with:
      file_to_build: voice_signal/Dockerfile
      cache: false
      push_to_images: |
        ghcr.io/${{ github.repository_owner }}/mastodon-voice-signal
      flavor: |
        latest=false
      tags: |
        type=raw,value=main
        type=sha,format=short
    secrets: inherit
