      defaults:
        custom_css_text: Plain CSS, applied only to your own session. Maximum 100
          KB.
        is_cat: Mark your account as a cat. Compatible apps will show cat ears on
          your avatar.
        setting_auto_accept_followed: Automatically approve follow requests from accounts
          you already follow, even while your account is locked.
        setting_auto_quote_from_url: When your post contains a link to another fediverse
          post that can be fetched, it is automatically turned into a quote without
          asking the author for permission. The quoted author is not asked to approve
          it.
        setting_bridge_unlisted_to_bsky: Your unlisted posts stay quiet on the fediverse,
          but are delivered to the Bluesky bridge (bsky.brid.gy) as public so they
          get bridged to Bluesky. Requires following the bridge account.
        setting_custom_emoji_size: Display Original size of Long Horizontally Custom
          Emoji
        setting_avatar_decoration_shape: Force the profile image shape while an avatar
          decoration is active.
        setting_mfm_animations: Play animations in MFM content (spin, bounce, shake,
          etc.). Disabling this will show static fallbacks instead.
        setting_mfm_enabled: Render MFM-formatted content from Misskey and compatible
          servers with animations and styles
        setting_mfm_fold_mode: Choose when to fold (collapse) MFM posts behind an
          expand toggle. 'Sensitive' folds posts with animation, scale, or border
          effects. 'All' folds every MFM post.
        setting_pages_view: Choose the layout visitors see when opening your Pages.
        setting_pages_blog_list_position: Choose where the Pages list appears on wide screens. On narrow screens it is shown below the Page.
        setting_ignore_others_pages_view: Always use the standard layout when opening other users' Pages.
        setting_prevent_ai_learning: Ask crawlers not to use your posts and media
          for AI training. This is a request only and cannot be enforced.
        setting_reaction_custom_emoji_size: Display Original size of Long Horizontally
          Custom Emoji on Reaction Button
        setting_show_avatar_decorations: Display avatar decoration frames on profiles.
          Off by default.
        setting_show_cat: Show cat ears on cat accounts' avatars and cat speak (nyaify)
          on their posts. On by default.
        setting_show_cat_speak: Apply cat speak (nyaify) to cat accounts' posts. Turn
          this off to keep cat ears while displaying posts as written.
        setting_show_federated_avatar_decorations: Also show decorations received
          from Misskey-compatible servers
        setting_show_federated_cat: Also apply cat effects to cat accounts received
          from federated servers
        setting_show_online_status: Others can see whether you are online, recently
          active, or offline. When disabled, your status appears as unknown to everyone.
        setting_show_reactions: Allow others to see which posts you have reacted to
          on your profile.
        setting_use_custom_css: When enabled, your own custom CSS below is applied
