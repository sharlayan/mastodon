          with it. Remote custom emojis still appear in the picker, but reacting with
          one that has no local counterpart is blocked. Unicode emoji and local custom
          emoji are unaffected.
        title: Restrict reactions to local custom emoji
      reactions:
        enabled: Enable emoji reactions
        enabled_hint: Allow users to react to posts with emoji. When disabled, the
          reaction button is hidden and new reactions are rejected. Existing reactions
          remain visible.
        title: Reactions
      special_features:
        title: Special features
