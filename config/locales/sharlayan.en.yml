          these users to bypass moderation approval
    settings:
      roleplay:
        title: Community mode settings
        notice_html: Community mode forces the settings below to protect the server's private operation. They cannot be changed while the mode is enabled.
      community_mode_override:
        title: Community Mode Overrides
        preamble: While Community Mode is active, these options override each user's personal preference and force the feature on for everyone.
        force_avatar_decorations: Force avatar decoration display
        force_avatar_decorations_hint: Ignore each user's avatar decoration display preference and show avatar decorations for everyone. Requires avatar decorations to be enabled above.
        force_round_avatar: Force round avatar images
        force_round_avatar_hint: Display every avatar image as a circle for all users, regardless of theme.
        force_mfm_enabled: Force MFM rendering
        force_mfm_enabled_hint: Ignore each user's MFM rendering preference and render MFM for everyone.
      allow_user_custom_css:
        desc_html: Let users define their own custom CSS that is applied only to their
          own session in the web interface. When disabled, any stored user CSS stops
          being applied.
        title: Allow user custom CSS
      antenna:
        enabled: Enable antennas
        enabled_hint: Allow users to create antennas that automatically collect posts
          matching conditions (accounts, domains, tags, keywords). When disabled,
          the antenna page, navigation link and API are unavailable.
        title: Antennas
      auto_quote_from_url:
        enabled: Allow auto quote from post links
        enabled_hint: Let users opt in to automatically turning fetchable fediverse
          post links in their posts into quotes, without asking the quoted author
          for permission. Each user must still enable it in their own preferences.
        title: Auto quote from URL
      avatar_decorations:
        enabled: Enable avatar decorations
        enabled_hint: Allow users to display avatar decorations on their profiles
        federation_enabled: Enable decoration federation
        federation_enabled_hint: Fetch and display decorations from remote Misskey-compatible
          servers
        local_only_view: Remote decorations only
        local_only_view_hint: Disable local decorations; only show decorations received
          from federated servers
        max_count: Maximum decorations per user
        max_count_hint: Maximum number of decorations a user may activate at once
          (0–16)
        title: Avatar Decorations
      board_announcements:
        enabled: Enable board announcements
        enabled_hint: Allow users to view the site-internal bulletin board announcements
          page. When disabled, the page and navigation link are hidden.
        title: Board Announcements
      cat:
        enabled: Enable cat accounts
        enabled_hint: Let local users mark themselves as a cat, adding cat ears to
          their avatar and cat speak (nyaify) to their posts. Viewers can turn the
          effects off in their own preferences.
        federation_enabled: Enable cat federation
        federation_enabled_hint: Send this server's cat flag to remote servers, and
          apply the cat effects to accounts received from federated servers.
        title: Cat accounts
      circles:
        enabled: Enable circles
        enabled_hint: Allow users to create circles and publish posts visible only
          to selected followers.
        title: Circles
      clips:
        enabled: Enable clips
        enabled_hint: Allow users to create clips and collect posts into named collections.
          When disabled, existing clips are kept but cannot be accessed.
        title: Clips
      community_mode:
        soft_hide_deletion: Keep deleted posts for the owner
        soft_hide_deletion_hint: When a post is deleted, hide it instead of destroying
          it. Hidden posts and their media leave every feed, search index and public
          page, and only the owner can still read them from the management timeline.
          Deleting a hidden post again removes it permanently.
        title: Community mode
      custom:
        title: Custom
      discovery:
        preamble: Surfacing interesting content is instrumental in onboarding new
          users who may not know anyone on Mastodon. Control how various discovery
          features work on your server.
      drive:
        allowed_extensions: Additional allowed file extensions
        allowed_extensions_hint: 'Image, video and audio uploads are always allowed.
          List any extra extensions to allow, separated by commas (for example: pdf,
          zip, txt). These extensions can never be allowed, because the files are
          served from this server''s own domain: %{extensions}.'
        allowed_extensions_invalid: 'cannot include these extensions: %{extensions}'
        enabled: Enable drive
        enabled_hint: Allow users to store uploads in a persistent per-account library
          and attach them to posts as symbolic links without duplicating bytes. When
          disabled, the drive button and API are unavailable.
        max_file_size: Maximum size per file (MB)
        max_file_size_hint: Maximum size of a single drive upload, in megabytes. Media
          files are still bound by the server's image and video limits.
        quota: Drive quota per account (MB)
        quota_hint: Maximum total size of a single account's drive library, in megabytes.
          Set to 0 for unlimited.
        title: Drive
      extensions:
        title: Extensions
      federation_instance_edges:
        enabled: Aggregate the instance federation graph
        enabled_hint: A nightly job groups boosts, replies, and quotes by the domains
          on both sides, one row per instance-to-instance edge. The result is the
          fediverse as seen from here — edges between two remote servers are included,
          but only where their activity reached us. Disable to skip the nightly scan.
        roleplay_hint: Unavailable while roleplay server mode is enabled. The instance
          federation graph is never aggregated in that mode.
        title: Instance federation graph
      federation_request_statistics:
        enabled: Record per-domain federation request counts
        enabled_hint: When enabled, the server counts delivery successes, delivery failures,
          and accepted inbox requests for each remote domain, and Misskey-compatible
          AP request charts report them. Counting is buffered in Redis and folded into
          the database once a minute. Disable to remove that background work if CPU
          headroom matters more than the statistics; existing rows are kept but stop
          growing.
        roleplay_hint: Unavailable while roleplay server mode is enabled. Per-domain
          federation request counts are never recorded in that mode.
        title: Federation request statistics
      instance_metadata:
        enabled: Enable instance information bar and metadata collection
        enabled_hint: When enabled, posts from other servers show an instance information
          bar (name, theme color, favicon) and the server collects metadata about
          federated instances. When disabled, the bar is hidden and no instance metadata
          is fetched.
        title: Instance Information Bar
      misskey_compat:
        enabled: Enable the Misskey-compatible API layer
        enabled_hint: When enabled, this server also answers a subset of the Misskey
          API so MiAuth-login apps like Aria for misskey and Flare can sign in, add
          reactions, and render MFM. Turning this on makes those apps detect this
          host as Misskey. Leave disabled to keep standard Mastodon behavior.
        title: Misskey-compatible API
        signin_flow_enabled: Enable same-origin Misskey web sign-in
        signin_flow_enabled_hint: Allow signin-flow for a Misskey web frontend served from this server or an explicitly allowed origin.
        signin_flow_allowed_origins: Additional allowed sign-in origins
        signin_flow_allowed_origins_hint: Exact HTTPS origins, separated by spaces or commas. Paths, wildcards, and implicit subdomains are not allowed.
        signin_flow_allowed_origins_invalid: "Invalid HTTPS origins: %{origins}"
        expose_follow_graph: Expose per-instance follow graph
        expose_follow_graph_hint: When enabled, signed-in Misskey-compatible clients can read the federation follower/following lists and per-user following charts. This reveals follow relationships even for accounts that hide their follows and followers, so leave it disabled unless you accept that trade-off. Endpoints always require a signed-in user.
      online_status:
        enabled: Enable online status indicators
        enabled_hint: When enabled, users who opt in can share whether they are online,
          recently active, or offline, shown as a dot on their avatar. When disabled,
          no online status is collected or shown to anyone, regardless of user settings.
        title: Online Status
      pages:
        drive_only: Only allow Drive files on pages
        drive_only_hint: Require page images and Booklet covers to come from Drive. Existing non-Drive media stays readable but must be removed or replaced before editing the page.
        enabled: Enable pages
        enabled_hint: Allow users to create block-based public pages. When disabled,
          existing pages are kept but cannot be accessed.
        title: Pages
      rate_limit_bypass:
        enabled: Allow privileged roles to bypass API rate limits
        enabled_hint: When enabled, users with the Administrator or DevOps permission
          are not subject to API rate limits. Leave disabled to apply rate limits
          to everyone.
        title: API Rate Limit Bypass
      reaction_local_emoji_only:
        desc_html: Require a custom emoji to also exist locally before users can react
          with it. Remote custom emojis still appear in the picker, but reacting with
          one that has no local counterpart is blocked. Unicode emoji and local custom
          emoji are unaffected.
        title: Restrict reactions to local custom emoji
      reactions:
        enabled: Enable emoji reactions
        enabled_hint: Allow users to react to posts with emoji. When disabled, the
          reaction button is hidden and new reactions are rejected. Existing reactions
          remain visible.
        title: Reactions
      special_features:
        title: Special features
