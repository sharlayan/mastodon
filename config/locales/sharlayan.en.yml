        max_count: Maximum decorations per user
        max_count_hint: Maximum number of decorations a user may activate at once
          (0–16)
        title: Avatar Decorations
      board_announcements:
        enabled: Enable board announcements
        enabled_hint: Allow users to view the site-internal bulletin board announcements
          page. When disabled, the page and navigation link are hidden.
        title: Board Announcements
      circles:
        enabled: Enable circles
        enabled_hint: Allow users to create circles and publish posts visible only
          to selected followers.
        title: Circles
      clips:
        enabled: Enable clips
        enabled_hint: Allow users to create clips and collect posts into named collections.
          When disabled, existing clips are kept but cannot be accessed.
        title: Clips
      custom:
        title: Custom
      discovery:
        preamble: Surfacing interesting content is instrumental in onboarding new
          users who may not know anyone on Mastodon. Control how various discovery
          features work on your server.
      drive:
        allowed_extensions: Additional allowed file extensions
        allowed_extensions_hint: 'Image, video and audio uploads are always allowed.
          List any extra extensions to allow, separated by commas (for example: pdf,
          zip, txt). These extensions can never be allowed, because the files are
          served from this server''s own domain: %{extensions}.'
        allowed_extensions_invalid: 'cannot include these extensions: %{extensions}'
        enabled: Enable drive
        enabled_hint: Allow users to store uploads in a persistent per-account library
          and attach them to posts as symbolic links without duplicating bytes. When
          disabled, the drive button and API are unavailable.
        max_file_size: Maximum size per file (MB)
        max_file_size_hint: Maximum size of a single drive upload, in megabytes. Media
          files are still bound by the server's image and video limits.
        quota: Drive quota per account (MB)
        quota_hint: Maximum total size of a single account's drive library, in megabytes.
          Set to 0 for unlimited.
        title: Drive
      extensions:
        title: Extensions
      instance_metadata:
        enabled: Enable instance information bar and metadata collection
        enabled_hint: When enabled, posts from other servers show an instance information
          bar (name, theme color, favicon) and the server collects metadata about
          federated instances. When disabled, the bar is hidden and no instance metadata
          is fetched.
        title: Instance Information Bar
      misskey_compat:
        enabled: Enable the Misskey-compatible API layer
        enabled_hint: When enabled, this server also answers a subset of the Misskey
          API so MiAuth-login apps like Aria for misskey and Flare can sign in, add
          reactions, and render MFM. Turning this on makes those apps detect this
          host as Misskey. Leave disabled to keep standard Mastodon behavior.
        title: Misskey-compatible API
      online_status:
        enabled: Enable online status indicators
        enabled_hint: When enabled, users who opt in can share whether they are online,
          recently active, or offline, shown as a dot on their avatar. When disabled,
          no online status is collected or shown to anyone, regardless of user settings.
